name: Cartoon Plus — Auto-Post

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force post now, ignoring schedule? (yes/no)'
        required: false
        default: 'yes'

jobs:
  build-and-post-cartoon:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check Schedule (Cartoon Plus)
      id: schedule_check
      run: |
        cat << 'EOF' > check_sched_cartoon.py
        import json, datetime
        import zoneinfo
        config = json.load(open('schedule_config_cartoon.json'))
        enabled = config.get('enabled', True)
        tz = zoneinfo.ZoneInfo(config.get('timezone', 'UTC'))
        now = datetime.datetime.now(tz)
        in_schedule = 'no'
        for t_str in config.get('generation_times', []):
            h, m = map(int, t_str.split(':'))
            sched_time = now.replace(hour=h, minute=m, second=0, microsecond=0)
            if 0 <= (now - sched_time).total_seconds() < 15 * 60:
                in_schedule = 'yes'
                break
        print(f"IN_SCHEDULE={in_schedule}")
        print(f"ENABLED={enabled}")
        EOF
        python3 check_sched_cartoon.py > sched_out_cartoon.txt
        source sched_out_cartoon.txt
        echo "In schedule: $IN_SCHEDULE | Enabled: $ENABLED"
        FORCE="${{ github.event.inputs.force_post }}"
        if [ "$FORCE" = "yes" ] || ([ "$IN_SCHEDULE" = "yes" ] && [ "$ENABLED" = "True" ]); then
          echo "should_post=true" >> $GITHUB_OUTPUT
          echo "✅ Proceeding with Cartoon Plus pipeline."
        else
          echo "should_post=false" >> $GITHUB_OUTPUT
          echo "⏳ Not posting time. Exiting early."
        fi

    - name: Set up Python
      if: steps.schedule_check.outputs.should_post == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      if: steps.schedule_check.outputs.should_post == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

    - name: Install Python Dependencies
      if: steps.schedule_check.outputs.should_post == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Secrets Files
      if: steps.schedule_check.outputs.should_post == 'true'
      run: |
        echo "PEXELS_API_KEYS=${{ secrets.PEXELS_API_KEYS }}" >> .env
        echo "PIXABAY_API_KEYS=${{ secrets.PIXABAY_API_KEYS }}" >> .env
        echo "ELEVENLABS_API_KEYS=${{ secrets.ELEVENLABS_API_KEYS }}" >> .env
        echo "GEMINI_API_KEYS=${{ secrets.GEMINI_API_KEYS }}" >> .env
        echo "DRIVE_FOLDER_ID=${{ secrets.DRIVE_FOLDER_ID }}" >> .env
        echo "${{ secrets.CLIENT_SECRET_JSON_B64 }}" | base64 --decode > client_secret.json
        # This uses the SEPARATE Cartoon Plus YouTube token secret
        echo "${{ secrets.YOUTUBE_TOKEN_CARTOON_JSON_B64 }}" | base64 --decode > youtube_token_cartoon.json
        # Google Drive token
        echo "${{ secrets.DRIVE_TOKEN_JSON_B64 }}" | base64 --decode > drive_token.json || echo "No drive token found."

    - name: Run Cartoon Plus Pipeline
      if: steps.schedule_check.outputs.should_post == 'true'
      run: python cartoon_main.py --headless

    - name: Save History Back to Repo
      if: steps.schedule_check.outputs.should_post == 'true' && always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

        # Pull latest first, using ours strategy so cloud-generated content wins on conflict
        git fetch origin main
        git merge -X ours origin/main -m "chore: merge remote history [skip ci]" --no-edit || true

        # Now stage and commit the freshly generated files on top
        git add generated_history_cartoon.txt latest_research_brief_cartoon.json 2>/dev/null || true
        git add video_progress.json 2>/dev/null || true
        git diff --staged --quiet || git commit -m "chore: update cartoon history & progress [skip ci]"
        git push
