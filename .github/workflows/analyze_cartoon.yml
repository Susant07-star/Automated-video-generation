name: Ã°ÂÂÂ­ Doctor Ã¢ÂÂ Cartoon Plus Self-Healing Analytics

on:
  schedule:
    # Runs every Sunday at 04:00 UTC by default (1 hour after NextGen to avoid overlap)
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      force_analyze:
        description: 'Force analysis now? (yes/no)'
        required: false
        default: 'yes'

jobs:
  analyze_cartoon:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit ai_directives_cartoon.txt back to repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Secrets Files
      run: |
        # Write both key name variants so heal_cartoon.py works regardless of env var name
        echo "GEMINI_API_KEYS=${{ secrets.GEMINI_API_KEYS }}" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEYS }}" >> .env
        # Cartoon Plus uses its own YouTube token
        echo "${{ secrets.YOUTUBE_TOKEN_CARTOON_B64 }}" | base64 --decode > youtube_token_cartoon.json
        echo "${{ secrets.CLIENT_SECRET_JSON_B64 }}" | base64 --decode > client_secret.json

    - name: Run Cartoon Plus Doctor (Self-Healing Analysis)
      run: python heal_cartoon.py

    - name: Save Results Back to Repo
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git add ai_directives_cartoon.txt posted_history_cartoon.json 2>/dev/null || true
        git diff --staged --quiet || git commit -m "chore: cartoon doctor updated ai_directives_cartoon + marked videos analyzed [skip ci]"
        git pull --rebase --autostash origin main
        git push
