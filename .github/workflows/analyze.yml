name: 🩺 Doctor — Self-Healing Analytics

on:
  schedule:
    # Runs every Sunday at 03:00 UTC by default
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      force_analyze:
        description: 'Force analysis now? (yes/no)'
        required: false
        default: 'yes'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit ai_directives.txt and posted_history.json back

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Secrets Files
      run: |
        # Write both key name variants so heal.py works regardless of env var name used
        echo "GEMINI_API_KEYS=${{ secrets.GEMINI_API_KEYS }}" >> .env
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEYS }}" >> .env
        echo "${{ secrets.CLIENT_SECRET_JSON_B64 }}" | base64 --decode > client_secret.json
        echo "${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}" | base64 --decode > youtube_token.json

    - name: Run Doctor (Self-Healing Analysis)
      run: python heal.py

    - name: Save Results Back to Repo
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        git add ai_directives.txt posted_history.json 2>/dev/null || true
        git diff --staged --quiet || git commit -m "chore: doctor updated ai_directives + marked videos analyzed [skip ci]"
        git pull --rebase --autostash origin main
        git push
